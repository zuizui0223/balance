<text class="header" x="78" y="735">Ledger summary: 17 independent clusters; 9 middle-regime signatures; 2 boundary-crossing clusters; 5 unresolved.</text>
<text class="note" x="78" y="765">Middle-regime signatures are conflict-without-splitting, persistent integration with an available alternative, and sandwiched transition mosaics.</text>
