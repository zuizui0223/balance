name: Reproduce Peucedanum 2025 R1 source models

on:
  push:
    branches:
      - ops/reproduce-peucedanum-r1-20261008

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lme4
            any::emmeans
            any::dplyr

      - name: Fetch exact HUSCAP archive
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://eprints.lib.hokudai.ac.jp/repo/huscap/all/95572/Kudo%24Shibata_JEcol_Data.zip' \
            -o 'Kudo$Shibata_JEcol_Data.zip'
          printf '%s  %s\n' \
            '07d9f718d58b795553d50c2cb2b33e9a7dd3df9e34b5c1757ed55d5674c777ca' \
            'Kudo$Shibata_JEcol_Data.zip' | sha256sum -c -
          unzip -q 'Kudo$Shibata_JEcol_Data.zip'

      - name: Reproduce registered R1 source models
        run: |
          Rscript ops/peucedanum_r1_reproduce.R

      - name: Upload R1 reproduction
        uses: actions/upload-artifact@v4
        with:
          name: peucedanum-2025-r1-reproduction
          path: |
            PEUCEDANUM_2025_R1_REPRODUCTION.csv
            R_SESSION_INFO.txt
          if-no-files-found: error
