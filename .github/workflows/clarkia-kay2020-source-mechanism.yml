name: Clarkia Kay 2020 original-source metadata and mechanism audit

on:
  pull_request:
    paths:
      - ".github/workflows/clarkia-kay2020-source-mechanism.yml"
      - "balance_domain/clarkia_kay2020_source.py"
      - "balance_domain/clarkia_published_receipts.py"
      - "balance_domain/pollen_architecture_mechanism_crosscheck.py"
      - "data/BALANCE_PLANT_U3_MATCHED_EXTRACTION_V1.csv"
      - "data/BALANCE_PLANT_U3_DEPENDENCE_V1.csv"
      - "data/CLARKIA_KAY2020_PUBLISHED_STATISTIC_RECEIPTS_V1.json"
      - "scripts/audit_clarkia_kay2020_dryad.py"
      - "scripts/audit_clarkia_published_receipts.py"
      - "scripts/audit_pollen_architecture_mechanisms.py"
      - "tests/test_clarkia_kay2020_source.py"
      - "tests/test_clarkia_published_receipts.py"
      - "tests/test_pollen_architecture_mechanism_crosscheck.py"
      - "docs/BALANCE_CLARKIA_COMPETING_MECHANISMS_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original DOI, version/digest declarations and source-result distinction
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_clarkia_kay2020_source.py
          python -m pytest -q tests/test_clarkia_published_receipts.py
          python -m pytest -q tests/test_pollen_architecture_mechanism_crosscheck.py

  audit-dryad-metadata:
    needs: trust-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve published Dryad 29-file source metadata (not OAuth-protected raw data)
        run: |
          python scripts/audit_clarkia_kay2020_dryad.py \
            --out /tmp/balance_kay2020_metadata_only.json > /tmp/balance_kay2020_stdout.json
      - name: Source hold is not absence of a biological effect
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads(Path("/tmp/balance_kay2020_metadata_only.json").read_text())
          assert r["status"]=="HOLD_PUBLIC_METADATA_ONLY_SOURCE_BYTES_REQUIRE_AUTH"
          assert r["paper_doi"]=="10.1098/rspb.2020.2593"
          assert r["dataset_doi"]=="10.5061/dryad.8cz8w9gmp"
          assert r["dataset_version_id"]==97733
          assert r["source_file_count"]==29
          assert len(r["original_file_digest_metadata_unverified_against_bytes"])==7
          assert r["source_files_verified"]==0
          assert r["source_rows_or_effect_sizes_computed"]==0
          assert r["original_bombustrials2018_csv_missing"] is True
          print("DRYAD SOURCE METADATA",r["dataset_doi"],r["dataset_version_id"])
          print("Declared original digest/size metadata:")
          for name,entry in r["original_file_digest_metadata_unverified_against_bytes"].items():
              print("  ",name,entry["id"],entry["size"],entry["sha256"])
          print("HOLD: source bytes require authorization; no raw effect was recomputed.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as f:
              f.write("## Clarkia Kay 2020 original source admission\\n\\n")
              f.write("- Dataset 10.5061/dryad.8cz8w9gmp version 97733: 29 source files, seven target file digests **declared by Dryad**, NOT independently byte-verified\\n")
              f.write("- Dryad archive API 401, public file_stream 403; result **HOLD_AUTH_REQUIRED** rather than biological negative\\n")
              f.write("- BombusTrials2018.csv mentioned in paper's file descriptions but absent from 29-file original dataset\\n")
          PY
      - name: Verify original paper's *published* statistics and derived ratios
        run: |
          python scripts/audit_clarkia_published_receipts.py --out /tmp/balance_kay2020_published_receipts.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          r=json.loads(Path("/tmp/balance_kay2020_published_receipts.json").read_text())
          assert r["status"]=="ORIGINAL_ARTICLE_SUMMARY_NOT_REANALYZED_DATA"
          assert r["source_original_study_programmes"]==1
          assert abs(r["published_exposed_pollen"]["no_dosing_over_dosing_ratio_computed"]-4.6/1.9)<1e-12
          assert abs(r["published_stigma_delivery"]["exponentiated_published_log_coefficient"]-math.exp(-.3507))<1e-12
          assert r["published_stigma_delivery"]["causal_effect_positive_certified"] is False
          assert r["published_stigma_delivery"]["strict_equivalence_certified"] is False
          assert r["actual_developmental_origin_from_conflict_established"] is False
          print("Original paper timing 11 spp, F=75.71, p=0.002")
          print("Exposed pollen no-dose vs dose, 4.6/1.9 mm =",r["published_exposed_pollen"]["no_dosing_over_dosing_ratio_computed"])
          print("Published delivery log effect=-0.3507; exp=",r["published_stigma_delivery"]["exponentiated_published_log_coefficient"],"p=0.27 (NOT demonstrated difference/equivalence)")
          print("Clarkia source outcome is NOT equivalent to Solanum reward-versus-export differentiation.")
          PY
      - name: Unpool original Clarkia vs U3 functional mechanisms with source hashes
        run: |
          python scripts/audit_pollen_architecture_mechanisms.py --out /tmp/balance_clarkia_u3_mechanism_crosscheck.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/balance_clarkia_u3_mechanism_crosscheck.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["distinct_source_taxa"]==10
          assert x["dependence_blocks_in_combined_selected_comparison"]==4
          assert x["no_binary_morphology_determines_mechanism"] is True
          assert all(x["constructive_morphology_nonidentifiability"].values())
          assert x["no_identified_same_axis_conflict_loss"] is True
          assert x["no_genetically_inherited_transition_or_historical_causality"] is True
          print("Source-selected morphology X ecological mechanism:",x["selected_morphology_by_mechanism"])
          print("U3 PASS pairs:",x["u3_pass_pairs"],"dependence blocks:",x["u3_taxonomic_dependence_blocks"])
          print("Clarkia original study programmes:",x["clarkia_independent_original_papers"])
          print("No general prevalence, environmental effect or historical trait origin inferred")
          PY
      - name: Archive original-source metadata-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: clarkia-kay2020-metadata-hold-${{ github.run_id }}
          path: |
            /tmp/balance_kay2020_metadata_only.json
            /tmp/balance_kay2020_published_receipts.json
            /tmp/balance_clarkia_u3_mechanism_crosscheck.json
          if-no-files-found: error
          retention-days: 30
