name: Clarkia Kay 2020 original-source metadata and mechanism audit

on:
  pull_request:
    paths:
      - ".github/workflows/clarkia-kay2020-source-mechanism.yml"
      - "balance_domain/clarkia_kay2020_source.py"
      - "balance_domain/clarkia_published_receipts.py"
      - "data/CLARKIA_KAY2020_PUBLISHED_STATISTIC_RECEIPTS_V1.csv"
      - "scripts/audit_clarkia_kay2020_dryad.py"
      - "scripts/audit_clarkia_published_receipts.py"
      - "tests/test_clarkia_kay2020_source.py"
      - "tests/test_clarkia_published_receipts.py"
      - "docs/BALANCE_CLARKIA_COMPETING_MECHANISMS_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original DOI, version/digest declarations and source-result distinction
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_clarkia_kay2020_source.py
          if test -f tests/test_clarkia_published_receipts.py; then
            python -m pytest -q tests/test_clarkia_published_receipts.py
          fi

  audit-dryad-metadata:
    needs: trust-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve published Dryad 29-file source metadata (not OAuth-protected raw data)
        run: |
          python scripts/audit_clarkia_kay2020_dryad.py \
            --out /tmp/balance_kay2020_metadata_only.json > /tmp/balance_kay2020_stdout.json
      - name: Source hold is not absence of a biological effect
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads(Path("/tmp/balance_kay2020_metadata_only.json").read_text())
          assert r["status"]=="HOLD_PUBLIC_METADATA_ONLY_SOURCE_BYTES_REQUIRE_AUTH"
          assert r["paper_doi"]=="10.1098/rspb.2020.2593"
          assert r["dataset_doi"]=="10.5061/dryad.8cz8w9gmp"
          assert r["dataset_version_id"]==97733
          assert r["source_file_count"]==29
          assert len(r["original_file_digest_metadata_unverified_against_bytes"])==7
          assert r["source_files_verified"]==0
          assert r["source_rows_or_effect_sizes_computed"]==0
          assert r["original_bombustrials2018_csv_missing"] is True
          print("DRYAD SOURCE METADATA",r["dataset_doi"],r["dataset_version_id"])
          print("Declared original digest/size metadata:")
          for name,entry in r["original_file_digest_metadata_unverified_against_bytes"].items():
              print("  ",name,entry["id"],entry["size"],entry["sha256"])
          print("HOLD: source bytes require authorization; no raw effect was recomputed.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as f:
              f.write("## Clarkia Kay 2020 original source admission\\n\\n")
              f.write("- Dataset 10.5061/dryad.8cz8w9gmp version 97733: 29 source files, seven target file digests **declared by Dryad**, NOT independently byte-verified\\n")
              f.write("- Dryad archive API 401, public file_stream 403; result **HOLD_AUTH_REQUIRED** rather than biological negative\\n")
              f.write("- BombusTrials2018.csv mentioned in paper's file descriptions but absent from 29-file original dataset\\n")
          PY
      - name: Archive original-source metadata-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: clarkia-kay2020-metadata-hold-${{ github.run_id }}
          path: /tmp/balance_kay2020_metadata_only.json
          if-no-files-found: error
          retention-days: 30
