name: Dalechampia 2015 blossom-clustered original-source sensitivity
'on':
  push:
    branches:
      - research/dalechampia-blossom-clustered-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blossom-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional independent regression dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'statsmodels>=0.14.5,<0.15'
          python -m pytest -q tests/test_dalechampia_blossom_clustered.py
      - name: Retrieve BOTH original Dryad files with published size/MD5
        run: |
          python scripts/retrieve_dalechampia_2015_dryad_bytes.py \
            --contract data/DALECHAMPIA_POSTANTHESIS_METHOD_AND_DRYAD_V2.json \
            --source-dir release/generated/original_dalechampia_files \
            --out release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json
      - name: Run and verify exact-source blossom/maternal clustered estimator
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          receipt=json.loads(Path("release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json").read_text())
          ready=(receipt["status"]=="ORIGINAL_DRYAD_BYTES_AND_ROW_SUPPORT_VERIFIED_NO_MODEL")
          Path("release/generated/DALECHAMPIA_ORIGINAL_SOURCE_READY.flag").write_text("READY" if ready else "HOLD")
          print("Original archived Dryad source ready:",ready)
          PY
          if [ "$(cat release/generated/DALECHAMPIA_ORIGINAL_SOURCE_READY.flag)" = "READY" ]; then
            python -m scripts.analyze_dalechampia_2015_blossom_clustered \
              --contract data/DALECHAMPIA_POSTANTHESIS_METHOD_AND_DRYAD_V2.json \
              --seed-file 'release/generated/original_dalechampia_files/Pelabon et al FE file 1.txt' \
              --gas-file 'release/generated/original_dalechampia_files/Pelabon et al FE file 2.txt' \
              --out release/generated/DALECHAMPIA_2015_BLOSSOM_CLUSTERED_SOURCE_V1.json
            python -m scripts.verify_dalechampia_blossom_clustered \
              --frozen data/DALECHAMPIA_2015_BLOSSOM_CLUSTERED_FROZEN_V1.json \
              --computed release/generated/DALECHAMPIA_2015_BLOSSOM_CLUSTERED_SOURCE_V1.json
          else
            echo "SOURCE_DOWNLOAD_HOLD; source-dependent models NOT executed"
          fi
      - name: Upload source and model audit receipts
        uses: actions/upload-artifact@v4
        with:
          name: dalechampia-2015-blossom-clustered-original-replay
          path: |
            release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json
            release/generated/DALECHAMPIA_2015_BLOSSOM_CLUSTERED_SOURCE_V1.json
          if-no-files-found: error
          retention-days: 30
