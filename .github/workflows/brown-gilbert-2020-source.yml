name: Brown Gilbert 2020 source-only experimental community rarity recovery
on:
  push:
    branches: [analysis/balance-rarity-independent-20261115]
    paths: [.github/workflows/brown-gilbert-2020-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download original Dryad dataset, verify source and describe row grain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import csv, hashlib, io, json, urllib.parse, urllib.request, zipfile
          out=Path("artifacts/brown_gilbert_2020_original")
          out.mkdir(parents=True,exist_ok=True)
          enc=urllib.parse.quote("doi:10.5061/dryad.8sf7m0cj7",safe="")
          root="https://datadryad.org/api/v2/datasets/"+enc
          def fetch(url,maxbytes):
              req=urllib.request.Request(url,headers={"User-Agent":"BALANCE-scholarly-source-audit/1.0", "Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=90) as response:
                  b=response.read(maxbytes+1);resolved=response.geturl()
              if len(b)>maxbytes:raise ValueError("Source exceeds size cap")
              return b,resolved
          meta,metaurl=fetch(root,2000000)
          metadata=json.loads(meta)
          if "8sf7m0cj7" not in (metadata.get("identifier","")+" "+metadata.get("title","")).lower():
              raise ValueError("Unexpected Dryad DOI")
          raw,final_url=fetch(root+"/download",12000000)
          if not zipfile.is_zipfile(io.BytesIO(raw)):raise ValueError("Original Dryad bundle is not ZIP")
          archive=out/"Brown_Gilbert_2020_original.zip"
          archive.write_bytes(raw)
          manifest=[]
          preview={}
          required={"fruit_data","seed_data","visitation_data","metadata"}
          found=set()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for e in z.infolist():
                  if e.is_dir():continue
                  from pathlib import PurePosixPath
                  if e.filename.startswith("/") or ".." in PurePosixPath(e.filename).parts:
                      raise ValueError("Unsafe original ZIP path")
                  b=z.read(e.filename)
                  nm=e.filename.lower()
                  for x in required:
                      if x in nm:found.add(x)
                  manifest.append({"path":e.filename,"size":len(b),"sha256":hashlib.sha256(b).hexdigest()})
                  if nm.endswith(".csv"):
                      txt=b.decode("utf-8-sig")
                      table=list(csv.reader(io.StringIO(txt)))
                      preview[e.filename]={"n_rows_ex_header":max(0,len(table)-1),
                                          "columns":table[0] if table else [],
                                          "first_two_rows":table[1:3]}
          if found!=required:
              raise ValueError("Required four files not confirmed: found "+str(sorted(found)))
          receipt={"doi":"10.5061/dryad.8sf7m0cj7","paper_doi":"10.1111/1365-2745.13390",
              "retrieved_utc":datetime.now(timezone.utc).isoformat(),
              "api_metadata_sha256":hashlib.sha256(meta).hexdigest(),
              "zip_sha256":hashlib.sha256(raw).hexdigest(),"zip_size":len(raw),
              "final_source_url":final_url,"source_files":manifest,
              "not_cross_study_meta_analysis":True,
              "V4_coder_fields_or_optimised_worldline_opened":False}
          (out/"SOURCE_RECEIPT.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n")
          (out/"SOURCE_SCHEMA_PREVIEW.json").write_text(json.dumps(preview,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({"receipt":receipt,"preview":preview},indent=2)[:18000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brown-gilbert-2020-actual-original
          path: artifacts/brown_gilbert_2020_original/
          if-no-files-found: error
          retention-days: 30
