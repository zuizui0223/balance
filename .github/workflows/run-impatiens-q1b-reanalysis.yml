name: Run Impatiens Q1B reanalysis

on:
  pull_request:
    paths:
      - "scripts/run_impatiens_q1b_reanalysis.py"
      - ".github/workflows/run-impatiens-q1b-reanalysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Reanalyse public Impatiens factorial archive
        run: python scripts/run_impatiens_q1b_reanalysis.py artifacts/q1b/BALANCE_IMPATIENS_Q1B_RECEIPT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-impatiens-q1b
          path: artifacts/q1b/BALANCE_IMPATIENS_Q1B_RECEIPT_V1.json
          if-no-files-found: error
