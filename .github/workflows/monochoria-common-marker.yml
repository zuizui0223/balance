name: Monochoria common-marker audit

on:
  push:
    branches:
      - feature/macro-persistent-compromise
    paths:
      - "balance_domain/monochoria_common_marker.py"
      - "data/BALANCE_PLANT_U3_MONOCHORIA_COMMON_MARKER_V1.csv"
      - ".github/workflows/monochoria-common-marker.yml"
  workflow_dispatch:

jobs:
  common-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install biopython
          sudo apt-get update -qq
          sudo apt-get install -y mafft
      - name: Run public-accession common-marker audit
        run: |
          mkdir -p /tmp/monochoria-common-marker
          python -m balance_domain.monochoria_common_marker \
            --ledger data/BALANCE_PLANT_U3_MONOCHORIA_COMMON_MARKER_V1.csv \
            --output /tmp/monochoria-common-marker/readout.json \
            --workdir /tmp/monochoria-common-marker/work
          cat /tmp/monochoria-common-marker/readout.json
      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: monochoria-common-marker-audit
          path: /tmp/monochoria-common-marker
