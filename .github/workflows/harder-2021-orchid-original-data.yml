name: Orchid 2021 authentic donor-pollen interference experiment

on:
  push:
    branches:
      - analysis/orchid-pollen-interference-zenodo-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-orchid-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover real 2021 orchid donor-source trials through official Zenodo mirror
        run: |
          python -m scripts.audit_harder_2021_zenodo_mirror \
            --source-dir "${RUNNER_TEMP}/harder-original-raw-not-uploaded" \
            --out "${RUNNER_TEMP}/harder-original-schema.json"
      - name: Check that original-source data recovery is NOT interpreted as effect replication
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"harder-original-schema.json"
          source=json.loads(p.read_text(encoding="utf-8"))
          assert source["status"]=="AUTHENTIC_SOURCE_SCHEMAS_VERIFIED_EXTRA_TRIAL_HOLD"
          assert source["independent_donor_visit_sequences"]==32
          assert source["original_treatment_trial_counts"]=={"Emasc":16,"Intact":16}
          assert source["trial_count_discrepancy_present"] is True
          assert source["source_trial_admission"]=="HOLD_UNEXPLAINED_EXTRA_INTACT_TRIAL"
          assert source["raw_data_effects_estimated"]==0
          print("AUTHENTIC_ORCHID_SCHEMA_VERIFIED",source["sha256"])
          print("ORIGINAL_TRIAL_COUNTS",source["original_treatment_trial_counts"])
          print("::warning::Original source includes one extra intact trial vs published n=15; do not choose a source row for exclusion by result or p-value")
          print("NO_BIOLOGICAL_EFFECT_REFIT",source["source_csv_columns"])
          PY
      - name: Quantify complete source-coded and all one-intact-exclusion effects
        run: |
          python -m scripts.audit_harder_2021_export_sensitivity \
            --original-csv "${RUNNER_TEMP}/harder-original-raw-not-uploaded/Data_for_AmNat.csv" \
            --out "${RUNNER_TEMP}/harder-source-code-group-sensitivity.json"
      - name: Keep only provenance and trial-group descriptive sensitivity, not original donor rows
        uses: actions/upload-artifact@v4
        with:
          name: balance-orchid-2021-candidate-trial-envelope
          path: ${{ runner.temp }}/harder-source-code-group-sensitivity.json
          if-no-files-found: error
          retention-days: 21
      - name: Independently check original journal R/Excel supplement archive for trial admissions
        run: |
          python -m scripts.audit_harder_2021_publisher_supplements \
            --out "${RUNNER_TEMP}/harder-publisher-supplements-metadata.json"
      - name: Preserve publisher supplement source accessibility metadata only
        uses: actions/upload-artifact@v4
        with:
          name: balance-orchid-2021-publisher-supplements-access
          path: ${{ runner.temp }}/harder-publisher-supplements-metadata.json
          if-no-files-found: error
          retention-days: 21
      - name: Store only original file identity, schema and trial-grain receipt
        uses: actions/upload-artifact@v4
        with:
          name: balance-orchid-2021-original-schema-only
          path: ${{ runner.temp }}/harder-original-schema.json
          if-no-files-found: error
          retention-days: 21
