name: Smoke BALANCE plant V4 production fit-job boundary

on:
  workflow_dispatch:
  push:
    branches:
      - ops/v4-production-wrapper-smoke-20261006

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen CmdStan 2.40.0 release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL             https://github.com/stan-dev/cmdstan/releases/download/v2.40.0/cmdstan-2.40.0.tar.gz             -o cmdstan-2.40.0.tar.gz
          tar -xzf cmdstan-2.40.0.tar.gz
          test -d "$RUNNER_TEMP/cmdstan-2.40.0"

      - name: Run real production fit-job smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke_test_plant_v4_fit_job.py             --cmdstan-dir "$RUNNER_TEMP/cmdstan-2.40.0"             --work-dir "$RUNNER_TEMP/v4-fit-job-smoke"

      - name: Verify smoke receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "v4-fit-job-smoke"
          receipt = json.loads((root / "FIT_JOB_SMOKE_RECEIPT.json").read_text())
          assert receipt["analysis"] == "balance_plant_v4_cmdstan_fit_job_smoke"
          assert receipt["cmdstan_version"] == "2.40.0"
          assert receipt["sampling"]["chains"] == 4
          assert receipt["sampling"]["num_samples"] == 25
          assert receipt["input_surface"] == (
              "production_build_v4_analysis_inputs_from_synthetic_licensed_assembly"
          )
          assert receipt["synthetic_analysis_rows"] == 12
          assert receipt["active_job_shape"] == [
              "PRIMARY",
              "PRIMARY_PRIOR_SENSITIVITY",
              "TEMPORAL_GENERALITY",
              "TEMPORAL_GENERALITY_PRIOR_SENSITIVITY",
          ]
          for key in (
              "primary",
              "primary_prior_sensitivity",
              "generality",
              "generality_prior_sensitivity",
          ):
              assert receipt[key]["n_chains"] == 4
              assert receipt[key]["n_draws_total"] == 100
              assert receipt[key]["cmdstan_version"] == "2.40.0"
              assert receipt[key]["stansummary_sha256"]
          assert receipt["claim_ceiling"] == (
              "production_wrapper_engine_parser_smoke_only_not_production_fit_or_diagnostics"
          )

          for job in (
              "PRIMARY_SMOKE",
              "PRIMARY_PRIOR_SENSITIVITY_SMOKE",
              "GENERALITY_SMOKE",
              "GENERALITY_PRIOR_SENSITIVITY_SMOKE",
          ):
              job_dir = root / job
              assert (job_dir / "FIT_RECEIPT.json").is_file()
              assert (job_dir / "stansummary.csv").is_file()
              assert (job_dir / "stansummary.log").is_file()
              assert len(list(job_dir.glob("chain_*.csv"))) == 4
          PY

      - name: Collect smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          out=release/generated/plant_v4_fit_job_smoke
          mkdir -p \
            "$out/PRIMARY_SMOKE" \
            "$out/PRIMARY_PRIOR_SENSITIVITY_SMOKE" \
            "$out/GENERALITY_SMOKE" \
            "$out/GENERALITY_PRIOR_SENSITIVITY_SMOKE"
          cp "$RUNNER_TEMP/v4-fit-job-smoke/FIT_JOB_SMOKE_RECEIPT.json" "$out/"
          for job in \
            PRIMARY_SMOKE \
            PRIMARY_PRIOR_SENSITIVITY_SMOKE \
            GENERALITY_SMOKE \
            GENERALITY_PRIOR_SENSITIVITY_SMOKE
          do
            cp "$RUNNER_TEMP/v4-fit-job-smoke/$job/FIT_RECEIPT.json" "$out/$job/"
            cp "$RUNNER_TEMP/v4-fit-job-smoke/$job/stansummary.csv" "$out/$job/"
            cp "$RUNNER_TEMP/v4-fit-job-smoke/$job/stansummary.log" "$out/$job/"
            cp "$RUNNER_TEMP/v4-fit-job-smoke/$job"/chain_*.csv "$out/$job/"
            cp "$RUNNER_TEMP/v4-fit-job-smoke/$job"/chain_*.log "$out/$job/"
          done

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: balance-plant-v4-cmdstan-fit-job-smoke
          path: release/generated/plant_v4_fit_job_smoke/
          if-no-files-found: error
