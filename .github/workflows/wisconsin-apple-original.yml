name: Wisconsin apple orchard original source recovery
on:
  push:
    branches: [analysis/apple-orchard-independent-20261115]
    paths:
      - .github/workflows/wisconsin-apple-original.yml
      - scripts/audit_wisconsin_apple_independent.py
      - tests/test_wisconsin_apple_independent.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire 2015 archived original orchard files and source checksum receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, urllib.request, zipfile
          out=Path("artifacts/wisconsin_apple_original")
          out.mkdir(parents=True,exist_ok=True)
          source="https://zenodo.org/records/4943340/files/"
          expected={"fruitsetbees.xlsx":"5445fb585421e6d9b1f5b5869342bbb4",
                    "beevisitation.xlsx":"f5a99ce414f7294841ba11d46d80b805"}
          manifest={}
          for name,md5 in expected.items():
              req=urllib.request.Request(source+name+"?download=1",headers={"User-Agent":"BALANCE-Research-Audit/1.0"})
              with urllib.request.urlopen(req, timeout=120) as response:
                  raw=response.read(1500000)
                  final=response.url
              if hashlib.md5(raw).hexdigest()!=md5:
                  raise ValueError(f"Source MD5 mismatch {name}: {hashlib.md5(raw).hexdigest()}")
              if len(raw)<5000 or len(raw)>1500000 or not zipfile.is_zipfile(__import__('io').BytesIO(raw)):
                  raise ValueError("Source is not expected XLSX")
              (out/name).write_bytes(raw)
              manifest[name]={"bytes":len(raw),"source_url":source+name+"?download=1",
                  "resolved_url":final,"md5":md5,"sha256":hashlib.sha256(raw).hexdigest()}
          receipt={"schema":"BALANCE_WISCONSIN_APPLE_ORIGINAL_SOURCE_V1",
              "dataset_doi":"10.5061/dryad.t75c4",
              "paper_doi":"10.1111/1365-2664.12377",
              "zenodo_record":"https://zenodo.org/records/4943340",
              "retrieved_utc":datetime.now(timezone.utc).isoformat(),
              "files":manifest,"source_only":True,"V4_frozen_outcomes_modified":False}
          (out/"SOURCE_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
      - name: Emit independent XLSX worksheet grain and schema previews
        run: |
          python -m pip install 'openpyxl>=3.1,<4'
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          import json
          base=Path("artifacts/wisconsin_apple_original")
          profile={}
          for name in ("fruitsetbees.xlsx","beevisitation.xlsx"):
              w=load_workbook(base/name,read_only=True,data_only=True)
              sheets={}
              for sheet in w:
                  rows=list(sheet.iter_rows(values_only=True))
                  sheets[sheet.title]={"n_rows":len(rows),
                      "headers":list(rows[0]) if rows else [],
                      "first_two": [list(x) for x in rows[1:3]]}
              profile[name]=sheets
          (base/"ORIGINAL_SHEETS.json").write_text(json.dumps(profile,indent=2,default=str)+"\n")
          print(json.dumps(profile,indent=2,default=str)[:15000])
          PY
      - name: Reproduce orchard-grouped conditional prediction and provenance tests
        shell: bash
        run: |
          python -m pip install 'numpy>=1.24,<3' 'pytest>=8,<10'
          BALANCE_WISCONSIN_APPLE_ORIGINAL=artifacts/wisconsin_apple_original/fruitsetbees.xlsx python -m pytest -q tests/test_wisconsin_apple_independent.py
          python scripts/audit_wisconsin_apple_independent.py --source artifacts/wisconsin_apple_original/fruitsetbees.xlsx --out artifacts/wisconsin_apple_original/ORCHARD_CONDITIONAL_RESULTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: wisconsin-apple-source-original
          path: artifacts/wisconsin_apple_original/
          if-no-files-found: error
          retention-days: 30
