name: Fetch Gymnadenia supplement direct

on:
  pull_request:
    paths:
      - "scripts/fetch_gymnadenia_supplement_direct.py"
      - ".github/workflows/fetch-gymnadenia-supplement-direct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF reader
        run: python -m pip install pypdf
      - name: Fetch supplement DOI directly
        run: python scripts/fetch_gymnadenia_supplement_direct.py artifacts/q1b/BALANCE_GYMNADENIA_SUPPLEMENT_DIRECT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-gymnadenia-supplement-direct
          path: artifacts/q1b/BALANCE_GYMNADENIA_SUPPLEMENT_DIRECT_V1.json
          if-no-files-found: error
