name: U3 Diascia ITS audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/macro-persistent-compromise
    paths:
      - "balance_domain/diascia_its_audit.py"
      - "tests/test_diascia_its_audit.py"
      - ".github/workflows/u3-diascia-its-audit.yml"

permissions:
  contents: read

jobs:
  diascia-its:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install biopython
          sudo apt-get update -qq
          sudo apt-get install -y mafft

      - name: Run public Diascia ITS audit
        run: |
          mkdir -p /tmp/diascia-its/work
          python -m balance_domain.diascia_its_audit \
            --output /tmp/diascia-its/readout.json \
            --workdir /tmp/diascia-its/work
          cat /tmp/diascia-its/readout.json

      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: u3-diascia-its-audit
          path: /tmp/diascia-its
          if-no-files-found: error
