name: Build BALANCE reality-pattern Figure 3

on:
  pull_request:
    paths:
      - "scripts/build_balance_pattern_map_figure3.py"
      - "data/BALANCE_PATTERN_LEDGER_V1.csv"
      - "data/BALANCE_PATTERN_READOUT_V1.json"
      - "tests/test_balance_pattern_map_figure3.py"
      - ".github/workflows/build-balance-pattern-map-figure3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Figure 3
        run: python scripts/build_balance_pattern_map_figure3.py artifacts/figure3/BALANCE_FIGURE3_REALITY_PATTERN_MAP_V1.svg
      - name: Verify recurrence and claim-ceiling contracts
        run: |
          grep -q "17 independent clusters; 9 middle-regime signatures" artifacts/figure3/BALANCE_FIGURE3_REALITY_PATTERN_MAP_V1.svg
          grep -q "recurrence map, not an estimate of natural prevalence" artifacts/figure3/BALANCE_FIGURE3_REALITY_PATTERN_MAP_V1.svg
          grep -q "do not estimate natural prevalence or direct BALANCE occupancy" artifacts/figure3/BALANCE_FIGURE3_REALITY_PATTERN_MAP_V1.svg
      - uses: actions/upload-artifact@v4
        with:
          name: balance-reality-pattern-figure3
          path: artifacts/figure3/BALANCE_FIGURE3_REALITY_PATTERN_MAP_V1.svg
          if-no-files-found: error
