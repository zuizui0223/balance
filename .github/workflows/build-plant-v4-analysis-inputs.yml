name: Validate BALANCE plant V4 analysis-input contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip pytest

      - name: Validate V4 contracts
        run: |
          python -m pytest -q \
            tests/test_plant_readiness.py \
            tests/test_plant_assembly_builder.py \
            tests/test_plant_model_assembly.py \
            tests/test_plant_model_v4.py \
            tests/test_plant_model_v4_fit.py \
            tests/test_plant_analysis_pipeline.py \
            tests/test_build_plant_v4_analysis_inputs.py \
            tests/test_plant_v4_cmdstan.py

      - name: Print tracked-input readiness
        run: |
          python scripts/build_plant_v4_analysis_inputs.py

      - name: Explain production build boundary
        run: |
          cat <<'EOF'
          This workflow validates the frozen V4 contracts only.
          Production analysis inputs require a validated composed human-review workspace,
          which is intentionally not stored in the repository or synthesized in CI.

          Run locally/on an authorized evidence workspace:
            python scripts/build_plant_v4_analysis_inputs.py \
              --input-dir <composed-human-workspace> \
              --out-dir <new-analysis-input-workspace> \
              --build
          EOF
