name: Wurmbea Case 2008 source ndhF and conditional seed fitness audit

on:
  pull_request:
    paths:
      - ".github/workflows/wurmbea-case2008-ndhf-history.yml"
      - "balance_domain/wurmbea_case2008_ndhf.py"
      - "balance_domain/wurmbea_case2008_four_locus.py"
      - "data/WURMBEA_CASE_2008_FOCAL_FOUR_LOCUS_VOUCHERS.csv"
      - "tests/test_wurmbea_case2008_multilocus.py"
      - "balance_domain/wurmbea_fitness_threshold.py"
      - "data/WURMBEA_CASE_2008_TABLE_A1_NDHF_VOUCHERS.csv"
      - "scripts/audit_wurmbea_case2008.py"
      - "tests/test_wurmbea_case2008_genbank.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact source manifests, pairwise alignment and no-causal-promotion
        run: |
          python -m pip install 'biopython>=1.84,<2' pytest
          python -m pytest -q tests/test_wurmbea_case2008_genbank.py tests/test_wurmbea_case2008_multilocus.py

  public-archive-replay:
    needs: source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sequence parser; source texts are not redistributed
        run: python -m pip install 'biopython>=1.84,<2'
      - name: Retrieve original source-registered exact ENA/INSDC accessions
        run: |
          python scripts/audit_wurmbea_case2008.py \
            --outdir /tmp/balance-wurmbea-genbank-2008 \
            > /tmp/balance-wurmbea-readout-stdout.json
      - name: Verify real accession counts and conditional interpretation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=Path("/tmp/balance-wurmbea-genbank-2008")
          nd=json.loads((p/"wurmbea_case2008_ndhf_source_receipt.json").read_text())
          th=json.loads((p/"wurmbea_case2008_conditional_thresholds.json").read_text())
          multi=json.loads((p/"wurmbea_case2008_focal_four_locus_readout.json").read_text())
          print("Focal original 4-locus accession status:",multi["status"])
          print("Original 4-locus records expected/downloaded/strict-voucher matched:",multi["source_unique_accessions_expected"],multi["fasta_accessions_downloaded"],multi["accessions_verified"])
          print("Original printed-table vs ENA voucher discordances held:",multi["source_voucher_conflicts_held"])
          print("GENBANK VOUCHER ALLOCATION SENSITIVITY, post-open only:",multi["genbank_voucher_assignment_sensitivity"])
          print("Original source missing marker:",multi["original_table_missing_marker"])
          for group, datum in multi["focal_groups"].items():
              print("FOCAL MULTILOCUS",group,datum["source_M_D"])
              for pair in datum["pairwise_descriptions"]:
                  print(" ",pair["vouchers"],pair["source_states"],"loci",pair["compared_loci"],
                        "mismatches",pair["total_pairwise_mismatches"],"sites",pair["total_pairwise_aligned_comparable_sites"],
                        "same in observed loci",pair["observed_identity_across_all_compared_loci"])
                  print("     per locus:",pair["loci"])
          print("SOURCE ndhF status:",nd["status"])
          print("Published voucher M/D:",nd["study_sex_state_vouchers"])
          print("Exact accessions expected/recovered:",nd["ndhf_accessions_expected"],nd["ndhf_accessions_recovered"])
          print("Failed retrieval accession reasons:",nd["failed_accessions"])
          for k,v in nd["focal_population_contrasts"].items():
              print("FOCAL:",k)
              print("  source population M/D:",v["registered_states"])
              print("  pairwise sample comparisons:",v["within_source_pairs_evaluated"])
              print("  opposite-sex pairs:",v["cross_sex_pairs_evaluated"])
              print("  underlying distances:",v["pair_details"])
          print("OBSERVED female seed advantage:",th["source"]["female_seed_fitness_advantage_regimes"])
          print("CONDITIONAL threshold crossing interval:",th["thresholds_for_a_strict_change_of_side"])
          print("Illustrative inherited transmission assumptions:",th["assumption_specific_results"])
          print("NO HISTORICAL OR STRUCTURAL CAUSAL INFERENCE")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## Case 2008 Wurmbea source voucher audit\n\n")
              f.write(f"- Original source: {nd['source']['doi']}, Table A1, single ndhF\n")
              f.write(f"- registered: {nd['ndhf_accessions_expected']} / recovered: {nd['ndhf_accessions_recovered']}\n")
              f.write(f"- source state: \`{nd['status']}\`\n")
              f.write(f"- original 4-locus FASTA accession bytes downloaded: {multi['fasta_accessions_downloaded']}/23\\n")
              f.write(f"- strict original Table A1-to-archive voucher matches: {multi['exact_source_voucher_identity_matches']}/23\\n")
              f.write(f"- four-locus result: {multi['status']}\\n")
              f.write("- No reconstructed phylogeny, inferred origins, or causal architectural payoff.\n")
          if nd["status"]!="VOUCHER_NDHF_METADATA_RECOVERED_NO_HISTORICAL_CAUSATION":
              raise SystemExit("HOLD: source retrieval incomplete; no genetic result promotion")
          if multi["status"] not in (
              "FOCAL_MULTILOCUS_SOURCE_VERIFIED_DESCRIPTIVE_ONLY",
              "SOURCE_TABLE_ARCHIVE_DISCORDANCE_HELD",
          ):
              raise SystemExit("HOLD: unexpected focal source retrieval or voucher discrepancy")
          if multi["status"]=="SOURCE_TABLE_ARCHIVE_DISCORDANCE_HELD":
              expected={"EU044680","EU044681"}
              held={x["accession"] for x in multi["source_voucher_conflicts_held"]}
              assert multi["fasta_accessions_downloaded"]==23
              assert multi["exact_source_voucher_identity_matches"]==21
              assert held==expected, "unexpected source-voucher mismatch is a hard HOLD"
          PY
      - name: Preserve source-verified aggregate, even on incomplete recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wurmbea-case2008-ndhf-source-receipt-${{ github.run_id }}
          path: |
            /tmp/balance-wurmbea-genbank-2008/*.json
          if-no-files-found: warn
          retention-days: 30
