name: Extract Gymnadenia Caruso Q1B source

on:
  pull_request:
    paths:
      - "scripts/extract_gymnadenia_from_caruso_dryad.py"
      - ".github/workflows/extract-gymnadenia-caruso-q1b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install spreadsheet reader
        run: python -m pip install openpyxl
      - name: Extract focal rows
        run: python scripts/extract_gymnadenia_from_caruso_dryad.py artifacts/q1b/BALANCE_GYMNADENIA_CARUSO_EXTRACT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-gymnadenia-caruso-extract
          path: artifacts/q1b/BALANCE_GYMNADENIA_CARUSO_EXTRACT_V1.json
          if-no-files-found: error
