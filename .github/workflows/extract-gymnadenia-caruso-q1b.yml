name: Probe Caruso Dryad nonduplicated workbook

on:
  push:
    branches:
      - ops/caruso-dryad-file-stream-probe-20261006

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current public Dryad file stream
        run: |
          set -euo pipefail
          mkdir -p release/generated/caruso_probe
          curl --fail --location --retry 2 --retry-all-errors \
            --user-agent "Mozilla/5.0 balance-caruso-probe/1" \
            --header "Referer: https://datadryad.org/dataset/doi:10.5061/dryad.2v8c5g0" \
            --output release/generated/caruso_probe/Exp_stud_NOTdup_Dryad.xls \
            https://datadryad.org/downloads/file_stream/21862
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("release/generated/caruso_probe/Exp_stud_NOTdup_Dryad.xls")
          b = p.read_bytes()
          assert len(b) > 400_000, len(b)
          assert b.startswith(bytes.fromhex("d0cf11e0a1b11ae1")), b[:16].hex()
          print("bytes", len(b))
          print("sha256", hashlib.sha256(b).hexdigest())
          PY

      - name: Upload exact nonduplicated workbook
        uses: actions/upload-artifact@v4
        with:
          name: balance-caruso-nonduplicated-dryad-xls
          path: release/generated/caruso_probe/Exp_stud_NOTdup_Dryad.xls
          if-no-files-found: error
