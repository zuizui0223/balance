name: Recover authenticated Tirpitzia female-stage originals
on:
  push:
    branches: [analysis/stage-dependence-small-n-20261126]
    paths:
      - scripts/recover_tirpitzia_female_originals.py
      - results/stage_dependence_small_n/TIRPITZIA_FEMALE_FILE_MANIFEST_20261126.json
      - .github/workflows/tirpitzia-female-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install xlrd==2.0.1
      - run: python -m scripts.recover_tirpitzia_female_originals
      - uses: actions/upload-artifact@v4
        with:
          name: tirpitzia-female-originals
          path: artifacts/tirpitzia_female_original/
          if-no-files-found: error
