name: Pedicularis 2013 latent-patch envelope source audit
'on':
  push:
    branches:
      - analysis/pedicularis-2013-latent-patch-bounds-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional XLSX source reader
        run: python -m pip install -e '.[dev,pedicularis]'
      - name: Validate exactness using exhaustive synthetic partition oracle
        run: python -m pytest -q tests/test_pedicularis_patch_assignment_bounds.py
      - name: Retrieve original Dryad manifest
        run: python scripts/probe_pedicularis_2013_dryad.py --out release/generated/PEDICULARIS_2013_DRYAD_SOURCE_DISCOVERY_V1.json
      - name: Download and hash-verify source XLSX inside archive
        run: |
          python scripts/retrieve_pedicularis_2013_dryad_bytes.py \
            --metadata release/generated/PEDICULARIS_2013_DRYAD_SOURCE_DISCOVERY_V1.json \
            --out-zip release/generated/PEDICULARIS_2013_DRYAD_SOURCE_VERSION_ZIP_V1.zip \
            --out-receipt release/generated/PEDICULARIS_2013_DRYAD_RAW_BYTE_RECEIPT_V1.json
      - name: Run 2011 relaxed patch-assignment envelope on original measurements
        run: |
          python -m scripts.audit_pedicularis_2013_patch_assignment \
            --source-zip release/generated/PEDICULARIS_2013_DRYAD_SOURCE_VERSION_ZIP_V1.zip \
            --out release/generated/PEDICULARIS_2013_RELAXED_PATCH_ASSIGNMENT_ENVELOPE_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: pedicularis-2013-relaxed-latent-patch-bounds
          path: |
            release/generated/PEDICULARIS_2013_DRYAD_RAW_BYTE_RECEIPT_V1.json
            release/generated/PEDICULARIS_2013_RELAXED_PATCH_ASSIGNMENT_ENVELOPE_V1.json
          if-no-files-found: error
