name: Verify Peucedanum 2025 raw ingest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ingest dependencies
        run: |
          python -m pip install -e '.[dev,peucedanum]'

      - name: Validate Peucedanum ingest contracts
        run: |
          python -m pytest -q \
            tests/test_peucedanum_raw_contract.py \
            tests/test_peucedanum_raw_extremes.py \
            tests/test_peucedanum_ingest.py

      - name: Fetch exact HUSCAP archive
        run: |
          mkdir -p release/generated/peucedanum_2025_source
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://eprints.lib.hokudai.ac.jp/repo/huscap/all/95572/Kudo%24Shibata_JEcol_Data.zip' \
            -o 'release/generated/peucedanum_2025_source/Kudo$Shibata_JEcol_Data.zip'
          printf '%s  %s\n' \
            '07d9f718d58b795553d50c2cb2b33e9a7dd3df9e34b5c1757ed55d5674c777ca' \
            'release/generated/peucedanum_2025_source/Kudo$Shibata_JEcol_Data.zip' \
            | sha256sum -c -
          unzip -t 'release/generated/peucedanum_2025_source/Kudo$Shibata_JEcol_Data.zip'

      - name: Verify frozen raw-source receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          archive = Path(
              "release/generated/peucedanum_2025_source/"
              "Kudo$Shibata_JEcol_Data.zip"
          )
          receipt = json.loads(
              Path(
                  "empirical/peucedanum/"
                  "PEUCEDANUM_2025_RAW_SOURCE_RECEIPT_V1.json"
              ).read_text(encoding="utf-8")
          )
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == (
              receipt["source"]["outer_zip_sha256"]
          )
          expected = {
              row["path"]: row["sha256"]
              for row in receipt["members"]
          }
          with zipfile.ZipFile(archive) as zf:
              actual = {
                  info.filename: hashlib.sha256(zf.read(info)).hexdigest()
                  for info in zf.infolist()
                  if not info.is_dir()
              }
          assert actual == expected
          PY

      - name: Inventory exact source bytes
        run: |
          python scripts/ingest_peucedanum_raw.py inventory \
            'release/generated/peucedanum_2025_source/Kudo$Shibata_JEcol_Data.zip' \
            --out-dir release/generated/peucedanum_2025_inventory_v1

      - name: Apply source-verified semantic mapping
        run: |
          python scripts/ingest_peucedanum_raw.py normalize \
            'release/generated/peucedanum_2025_source/Kudo$Shibata_JEcol_Data.zip' \
            --mapping empirical/peucedanum/PEUCEDANUM_RAW_SEMANTIC_MAPPING_TEMPLATE_V1.json \
            --out-dir release/generated/peucedanum_2025_normalized_v1

      - name: Verify normalized 2025 surface
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("release/generated")
          receipt = json.loads(
              (
                  root
                  / "peucedanum_2025_normalized_v1"
                  / "BALANCE_PEUCEDANUM_NORMALIZATION_RECEIPT_V1.json"
              ).read_text(encoding="utf-8")
          )
          assert receipt["status"] == "SOURCE_VERIFIED_MAPPING_APPLIED"
          assert receipt["source_hash_binding_verified"] is True
          assert receipt["normalized_rows"] == 685
          source = receipt["source_files"]["Kudo$Shibata_JEcol_Data.zip"]
          assert source["source_sha256"] == (
              "07d9f718d58b795553d50c2cb2b33e9a7dd3df9e34b5c1757ed55d5674c777ca"
          )

          rows_path = (
              root
              / "peucedanum_2025_normalized_v1"
              / "BALANCE_PEUCEDANUM_NORMALIZED_ROWS_V1.csv"
          )
          with rows_path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 685
          assert {row["year"] for row in rows} == {"2020", "2021", "2022", "2023"}
          assert {row["population_id"] for row in rows} == {"HA", "HL", "HC", "KD", "HD"}
          assert all(row["flowering_day"] == "" for row in rows)
          assert all(row["total_flower_count"] != "" for row in rows)
          assert all(row["male_fraction"] != "" for row in rows)
          print("normalized_rows", len(rows))
          PY

      - name: Upload reproducibility receipts
        uses: actions/upload-artifact@v4
        with:
          name: peucedanum-2025-raw-ingest-v1
          path: |
            release/generated/peucedanum_2025_inventory_v1/
            release/generated/peucedanum_2025_normalized_v1/
          if-no-files-found: error
