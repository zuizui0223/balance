name: Dalechampia 2015 original Dryad recovery
'on':
  push:
    branches:
      - research/dalechampia-original-dryad-retrieval-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and check synthetic provenance guards
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_dalechampia_method_scope.py tests/test_retrieve_dalechampia_2015_dryad_bytes.py tests/test_dalechampia_raw_sensitivity.py
      - name: Attempt official archive acquisition with a nonbiological HOLD
        run: |
          python scripts/retrieve_dalechampia_2015_dryad_bytes.py \
            --contract data/DALECHAMPIA_POSTANTHESIS_METHOD_AND_DRYAD_V2.json \
            --source-dir release/generated/original_dalechampia_files \
            --out release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json").read_text())
          print("Dalechampia Dryad status:",r["status"])
          print("Original bytes verified:",r["raw_file_bytes_verified"])
          print("Raw biological model fitted:",r["raw_reanalysis_executed"])
          if r["raw_reanalysis_executed"]:
              raise SystemExit("source retrieval must never claim statistical replay")
          PY
      - name: Run authentic matched-maternal descriptive sensitivity only after source parsing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json").read_text())
          Path("release/generated/DALECHAMPIA_SOURCE_READY.flag").write_text(
              "READY" if r["status"]=="ORIGINAL_DRYAD_BYTES_AND_ROW_SUPPORT_VERIFIED_NO_MODEL" else "HOLD"
          )
          PY
          if [ "$(cat release/generated/DALECHAMPIA_SOURCE_READY.flag)" = "READY" ]; then
            python -m scripts.analyze_dalechampia_2015_raw_maternal_sensitivity \
              --contract data/DALECHAMPIA_POSTANTHESIS_METHOD_AND_DRYAD_V2.json \
              --seed-file "release/generated/original_dalechampia_files/Pelabon et al FE file 1.txt" \
              --gas-file "release/generated/original_dalechampia_files/Pelabon et al FE file 2.txt" \
              --recovery-receipt release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json \
              --out release/generated/DALECHAMPIA_2015_RAW_MATERNAL_SENSITIVITY_V1.json
          else
            echo "Exact original source HOLD; no maternal analysis performed"
          fi
      - name: Preserve receipt and authenticated source files if available
        uses: actions/upload-artifact@v4
        with:
          name: dalechampia-2015-exact-dryad-recovery
          path: |
            release/generated/DALECHAMPIA_ORIGINAL_DRYAD_RECOVERY_V1.json
            release/generated/DALECHAMPIA_2015_RAW_MATERNAL_SENSITIVITY_V1.json
            release/generated/original_dalechampia_files/
          if-no-files-found: error
          retention-days: 30
