name: Assemble BALANCE manuscript

on:
  pull_request:
    paths:
      - "docs/BALANCE_ABSTRACT_V1.md"
      - "docs/BALANCE_INTRODUCTION_MANUSCRIPT_TEXT_V1.md"
      - "docs/BALANCE_THEORY_MANUSCRIPT_TEXT_V1.md"
      - "docs/BALANCE_EMPIRICAL_METHODS_MANUSCRIPT_TEXT_V1.md"
      - "docs/BALANCE_RESULTS_MANUSCRIPT_TEXT_V1.md"
      - "docs/BALANCE_DISCUSSION_SPINE_V1.md"
      - "docs/BALANCE_FIGURE1_CAPTION_V1.md"
      - "docs/BALANCE_FIGURE2_CAPTION_V1.md"
      - "docs/BALANCE_FIGURE3_CAPTION_V1.md"
      - "data/BALANCE_MANUSCRIPT_CITATION_LEDGER_V1.csv"
      - "data/BALANCE_PATTERN_CLUSTER_CITATION_MAP_V1.csv"
      - "manuscript/BALANCE_CANONICAL_MANUSCRIPT_MANIFEST_V1.json"
      - "scripts/assemble_balance_manuscript.py"
      - "tests/test_balance_manuscript_assembly.py"
      - "tests/test_balance_canonical_manifest.py"
      - ".github/workflows/assemble-balance-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble canonical manuscript
        run: python scripts/assemble_balance_manuscript.py artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
      - name: Verify manuscript ordering, figures, captions and claim ceiling
        run: |
          grep -q "## Introduction" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "## Theory" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "## Empirical synthesis methods" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "## Results" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "## Discussion" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "## Figure captions" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "### Figure 1" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "### Figure 2" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "### Figure 3" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "conditional on positive admission" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "not an unbiased" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "direct-worldline reserve therefore remains empty" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "figures/BALANCE_FIGURE3_REALITY_PATTERN_MAP_V1.svg" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "data/BALANCE_MANUSCRIPT_CITATION_LEDGER_V1.csv" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          grep -q "data/BALANCE_PATTERN_CLUSTER_CITATION_MAP_V1.csv" artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
      - name: Report canonical digest and size
        run: |
          sha256sum artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          wc -w artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          wc -l artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
      - name: Verify frozen canonical digest and size
        run: |
          echo "e064e672319bb267bc1a4a6dcbc06e817e8cc745c94be740d9e0a189b8bc9a76  artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md" | sha256sum -c -
          test "$(wc -w < artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md)" -eq 7555
          test "$(wc -l < artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md)" -eq 495
      - uses: actions/upload-artifact@v4
        with:
          name: balance-canonical-manuscript
          path: artifacts/manuscript/BALANCE_MANUSCRIPT_V1.md
          if-no-files-found: error
